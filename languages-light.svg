<svg xmlns="http://www.w3.org/2000/svg" width="400" height="195" viewBox="0 0 400 195" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Most used languages</title>
<desc id="desc">C# 61.6%, Shell 27.2%, TypeScript 5.3%, HTML 2.6%, CSS 2.5%, SCSS 0.7%</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #f0f6fc; }
  .label { font-size: 14px; }
  .value { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .small { font-size: 12px; }
  .col { font-size: 11px; fill: #7d8590; letter-spacing: 0.04em; }
  .secondary { fill: #9198a1; }
  .muted { fill: #7d8590; }
  .icon { fill: #9198a1; }
  .fade { animation: fade 0.45s ease-out both; }
  .grow { transform-box: fill-box; transform-origin: left center; animation: grow 0.9s cubic-bezier(.2,.7,.2,1) 0.15s both; }
  .ring { animation: ring 1.2s cubic-bezier(.2,.7,.2,1) 0.2s both; }
  .pop { transform-box: fill-box; transform-origin: center; animation: pop 0.4s ease-out 0.5s both; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } }
  @keyframes grow { from { transform: scaleX(0); } }
  @keyframes pop { from { opacity: 0; transform: scale(0.6); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect x="0.5" y="0.5" width="399" height="194" rx="6" fill="#0c0710" stroke="none"/>
<text x="20" y="28" class="col">MOST USED LANGUAGES</text>
<mask id="bar"><rect class="grow" x="20" y="48" width="360" height="10" rx="5" fill="#fff"/></mask>
<g mask="url(#bar)"><rect x="20.00" y="48" width="215.66" height="10" fill="#7355dd"/><rect x="237.66" y="48" width="95.35" height="10" fill="#89e051"/><rect x="335.01" y="48" width="18.42" height="10" fill="#3178c6"/><rect x="355.43" y="48" width="9.14" height="10" fill="#e34c26"/><rect x="366.57" y="48" width="8.84" height="10" fill="#663399"/><rect x="377.41" y="48" width="2.57" height="10" fill="#c6538c"/></g>
<g transform="translate(20 84)"><g class="fade" style="animation-delay: 200ms"><circle cx="5" cy="6" r="5" fill="#7355dd"/><text x="16" y="11" class="label">C# <tspan class="secondary">61.6%</tspan></text></g></g>
<g transform="translate(200 84)"><g class="fade" style="animation-delay: 270ms"><circle cx="5" cy="6" r="5" fill="#89e051"/><text x="16" y="11" class="label">Shell <tspan class="secondary">27.2%</tspan></text></g></g>
<g transform="translate(20 116)"><g class="fade" style="animation-delay: 340ms"><circle cx="5" cy="6" r="5" fill="#3178c6"/><text x="16" y="11" class="label">TypeScript <tspan class="secondary">5.3%</tspan></text></g></g>
<g transform="translate(200 116)"><g class="fade" style="animation-delay: 410ms"><circle cx="5" cy="6" r="5" fill="#e34c26"/><text x="16" y="11" class="label">HTML <tspan class="secondary">2.6%</tspan></text></g></g>
<g transform="translate(20 148)"><g class="fade" style="animation-delay: 480ms"><circle cx="5" cy="6" r="5" fill="#663399"/><text x="16" y="11" class="label">CSS <tspan class="secondary">2.5%</tspan></text></g></g>
<g transform="translate(200 148)"><g class="fade" style="animation-delay: 550ms"><circle cx="5" cy="6" r="5" fill="#c6538c"/><text x="16" y="11" class="label">SCSS <tspan class="secondary">0.7%</tspan></text></g></g>
</svg>
