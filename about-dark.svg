<desc id="desc">Hi, I&#39;m Leandro I&#39;m a software developer with 20+ years of experience. I&#39;m primarily a Backend Developer, with .NET as my main tech stack. However, I&#39;m comfortable exploring other areas and always willing to take on challenges beyond my primary focus. I have experience developing ERP systems, warehouse management solutions, and integrations between different platforms and services. I&#39;m also currently exploring the development of AI-powered agent solutions. Based in: Dois Vizinho - Paraná - BBrazil</desc>
